# nginx جلوی برنامه — HTTP برای صدور گواهی و انتقال به HTTPS
# قبل از صدور گواهی، بلوک server روی ۴۴۳ را کامنت کنید (راهنما: docs/DEPLOY.md)
upstream avinapps_app { server app:3000; keepalive 32; }

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  server_name avinapps.ir www.avinapps.ir;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://avinapps.ir$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.avinapps.ir;
  ssl_certificate     /etc/nginx/certs/live/avinapps.ir/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/avinapps.ir/privkey.pem;
  return 301 https://avinapps.ir$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name avinapps.ir;

  ssl_certificate     /etc/nginx/certs/live/avinapps.ir/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/avinapps.ir/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # آپلود فایل نصب نسخه‌ها از پنل (حداکثر ۳۰۰ مگابایت)
  client_max_body_size 300m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location /_next/static/ {
    proxy_pass http://avinapps_app;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://avinapps_app;
  }

  # کارهای زمان‌بندی‌شده فقط از داخل شبکه‌ی Docker
  location /api/cron/ { return 404; }

  location / { proxy_pass http://avinapps_app; }
}
