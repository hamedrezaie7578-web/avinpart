# استقرار کامل:   docker compose --profile full up -d --build
# بار اول (seed):  docker compose --profile setup run --rm setup
# توسعه‌ی محلی:   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avin}
      POSTGRES_DB: ${POSTGRES_DB:-avinapps}
      TZ: Asia/Tehran
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avin}"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://avinapps.ir}
    image: avinapps:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-avin}:${POSTGRES_PASSWORD:-avin}@db:5432/${POSTGRES_DB:-avinapps}?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/storage
    profiles: ["full"]

  # migrate + seed (فقط بار اول یا پس از اضافه شدن محتوای جدید؛ تغییرات پنل را بازنویسی نمی‌کند)
  setup:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tools
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://avinapps.ir}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-avin}:${POSTGRES_PASSWORD:-avin}@db:5432/${POSTGRES_DB:-avinapps}?schema=public
    depends_on:
      db:
        condition: service_healthy
    profiles: ["setup"]

  # کارهای زمان‌بندی‌شده: یادآوری تمدید و پشتیبان‌گیری روزانه
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      TZ: Asia/Tehran
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./docker/crontab:/crontab:ro
    command: >
      sh -c "apk add --no-cache curl tzdata >/dev/null &&
             sed \"s|\\$$CRON_SECRET|$$CRON_SECRET|g\" /crontab > /etc/crontabs/root &&
             crond -f -l 8"
    depends_on:
      - app
    profiles: ["full"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    profiles: ["full"]

  # صدور/تمدید گواهی SSL رایگان (Let's Encrypt) — راهنما در docs/DEPLOY.md
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./docker/certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles: ["certbot"]

volumes:
  pgdata:
  storage:
  certbot-www:
